<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1b1e27;
        color: #e6e9f0;
        width: 220px;
      }
      .psa-popup {
        padding: 12px;
      }
      .psa-popup-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .psa-popup-setting {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .psa-popup-capture {
        width: 100%;
        background: #16351f;
        color: #7ef0a8;
        border: 1px solid #1f5c33;
        border-radius: 6px;
        padding: 7px 0;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
      }
      .psa-popup-capture:hover {
        background: #1c4529;
      }
      .psa-popup-capture-stop {
        background: #351616;
        color: #f0a6a6;
        border-color: #5c1f1f;
      }
      .psa-popup-capture-stop:hover {
        background: #45201c;
      }
      .psa-popup-note {
        font-size: 11px;
        color: #8b93a6;
        margin: 8px 0 10px;
        line-height: 1.4;
      }
      .psa-popup-link {
        width: 100%;
        background: #232837;
        color: #9ecbff;
        border: 1px solid #2a2f3d;
        border-radius: 6px;
        padding: 6px 0;
        font-size: 12px;
        cursor: pointer;
        margin-top: 4px;
      }
      .psa-popup-link:hover {
        background: #2a3040;
      }
    </style>
  </head>
  <body>
    <div id="psa-root"></div>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
